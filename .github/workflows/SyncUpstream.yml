name: Sync Upstream (LegadoTeam/legado)

on:
  schedule:
    # 每天 UTC 02:00 运行一次。有上游更新才 merge，否则自动 skip。
    - cron: '0 2 * * *'
  workflow_dispatch: {}  # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Needed so later steps can push with GITHUB_TOKEN
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add or update upstream
        run: |
          # Development lineage is LegadoTeam/legado (gedoor/legado main is unrelated history).
          if git remote | grep -q '^upstream$'; then
            git remote set-url upstream https://github.com/LegadoTeam/legado.git
          else
            git remote add upstream https://github.com/LegadoTeam/legado.git
          fi
          git fetch upstream
          git remote set-head upstream -a

      - name: Check for upstream updates
        id: check
        run: |
          UPSTREAM_REF=$(git symbolic-ref --short refs/remotes/upstream/HEAD)
          echo "upstream_ref=$UPSTREAM_REF" >> "$GITHUB_OUTPUT"
          echo "Using upstream ref: $UPSTREAM_REF"
          LOCAL=$(git rev-parse master)
          REMOTE=$(git rev-parse "$UPSTREAM_REF")
          if git merge-base --is-ancestor "$REMOTE" "$LOCAL"; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "✅ Already up to date (upstream tip is ancestor of master)."
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "🔄 Upstream has commits to merge ($LOCAL <- $REMOTE)."
          fi

      - name: Merge upstream changes
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          # GHA defaults to bash -e; turn it off for merge so workflow conflicts
          # can be resolved to ours before we decide success/failure.
          set +e
          set -uo pipefail
          git checkout master
          BEFORE=$(git rev-parse HEAD)
          UPSTREAM_REF="${{ steps.check.outputs.upstream_ref }}"

          # Commit only after restoring workflows so the pushed merge never
          # creates/updates .github/workflows (GITHUB_TOKEN lacks `workflows` scope).
          git merge --no-commit --no-ff "$UPSTREAM_REF"
          MERGE_OK=$?

          rm -rf .github/workflows
          git checkout "$BEFORE" -- .github/workflows/
          git add -A .github/workflows/

          CONFLICTS="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$CONFLICTS" ]; then
            echo "::error::Unresolved conflicts outside .github/workflows (manual merge required):"
            printf '%s\n' "$CONFLICTS"
            git merge --abort 2>/dev/null || true
            exit 1
          fi

          if [ "$MERGE_OK" -ne 0 ]; then
            if [ ! -f .git/MERGE_HEAD ]; then
              echo "::error::git merge failed without leaving a merge-in-progress state."
              exit 1
            fi
            echo "Merge had conflicts; resolved by keeping fork .github/workflows."
          fi

          set -e
          git commit -m "chore: sync upstream from LegadoTeam/legado"

      - name: Push to origin
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          git push origin master
